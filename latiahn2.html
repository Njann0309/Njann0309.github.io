<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Belajar CSS Grid</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            box-sizing: border-box;
        }

        .grid-container {
            padding: 10px;
            height: 90vh;
            border: 2px solid black;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 300px 250px;
            gap: 20px;
            grid-template-areas:
                "item1 item2 item3 item3"
                "item4 item5 item5 item6"
                "item4 item7 item7 item8";
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .item {
            background-color: #4A90E2;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid black;
        }

        .item1 {
            grid-area : item1;
            background-color: red;
            background-image: url('https://www.google.com/imgres?q=image%20makanan&imgurl=https%3A%2F%2Fwww.mokapos.com%2Fblog%2F_next%2Fimage%3Furl%3Dhttps%253A%252F%252Fwp.mokapos.com%252Fwp-content%252Fuploads%252F2023%252F02%252Finspirasi-foto-makanan-yang-enak-ayam-panggang.jpg%26w%3D3840%26q%3D75&imgrefurl=https%3A%2F%2Fwww.mokapos.com%2Fblog%2Finspirasi-foto-makanan&docid=7RVTGeO6u6_nGM&tbnid=YwwwwCZAjDb4uM&vet=12ahUKEwjls82X-eKWAxXizTgGHcn8NlIQnPAOegUIxQIQAA..i&w=1200&h=800&hcb=2&ved=2ahUKEwjls82X-eKWAxXizTgGHcn8NlIQnPAOegUIxQIQAA');
            background-size: cover;
        }

         .item2 {
            grid-area : item2;
        }

         .item3 {
            grid-area : item3;
        }

         .item4 {
            grid-area : item4;
        }

         .item5 {
            grid-area : item5;
        }

         .item6 {
            grid-area : item6;
        }

        .item7 {
            grid-area : item7;
        }

        .item8 {
            grid-area : item8;
        }
    </style>
</head>

<body>

    <div class="grid-container">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item item3">3</div>
        <div class="item item4">4</div>
        <div class="item item5">5</div>
        <div class="item item6">6</div>
        <div class="item item7">7</div>
        <div class="item item8">8</div>
    </div>

</body>

</html>
